name: Refresh profile visuals

on:
  schedule:
    # Every 6 hours, at :17 past. GitHub queues scheduled jobs on shared runners and
    # the top of the hour is the most congested minute — a "0 18 * * *" run landed
    # 4h40m late on 2026-08-06. An odd minute gets picked up sooner.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: regenerate-profile-visuals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d-settings.json

      - name: Generate profile card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: node .github/scripts/profile-card.mjs

      - name: Commit and push if changed
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          # the 3D action also writes ~10 unused presets, so stage only the
          # files the README actually references
          git add --force \
            profile-3d-contrib/profile-3d-light.svg \
            profile-3d-contrib/profile-3d-dark.svg \
            assets/identity-light.svg \
            assets/identity-dark.svg
          if git commit -m "chore: refresh profile visuals"; then
            git push
          else
            echo "no changes to commit"
          fi
