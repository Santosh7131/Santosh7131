name: GitHub profile 3D contributions

on:
  schedule:
    # 18:00 UTC daily (03:00 JST) — keeps the 3D graph current
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: generate-profile-3d
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d-settings.json

      - name: Commit and push if changed
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          # only the two variants the README uses; the action also writes
          # ~10 unused presets we deliberately leave untracked
          git add --force profile-3d-contrib/profile-3d-light.svg profile-3d-contrib/profile-3d-dark.svg
          if git commit -m "chore: regenerate 3D contribution graph"; then
            git push
          else
            echo "no changes to commit"
          fi
