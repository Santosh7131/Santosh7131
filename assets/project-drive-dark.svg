  <text x="44" y="98" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#e6edf3">AI Learns To Drive</text>
  <text x="44" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3">A neural network teaches itself to race — no hand-coded driving rules.</text>

